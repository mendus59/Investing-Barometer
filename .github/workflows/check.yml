name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test scoring rules
        run: python -m unittest discover tests

      - name: Dry run against live FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update.py --out "$RUNNER_TEMP/data"

      - name: Dry run ZIP code data build
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          python scripts/update_zip.py --force --out "$RUNNER_TEMP/zip"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d, indent=1))" "$RUNNER_TEMP/zip/meta.json"
          du -sh "$RUNNER_TEMP/zip"
